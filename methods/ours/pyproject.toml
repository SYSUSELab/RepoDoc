[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repodoc"
version = "0.1.0"
description = "Repository knowledge-graph and hierarchical documentation prototype"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "networkx>=3.0",
  "tree-sitter>=0.25",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-rust>=0.24",
  "tree-sitter-go>=0.25",
  "tree-sitter-java>=0.23",
  "tree-sitter-php>=0.25",
  "tree-sitter-c>=0.24",
  "tree-sitter-cpp>=0.23",
  "tree-sitter-c-sharp>=0.24",
  "jsonschema>=4.20",
]

[project.scripts]
repodoc = "repodoc.cli:main"

[project.optional-dependencies]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
dense = [
  "fastembed>=0.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repodoc = ["schemas/*.json"]
