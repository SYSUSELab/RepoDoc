[project]
name = "repodoc"
version = "0.1.0"
description = "RepoDoc: Automated Documentation via Repository Knowledge Graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "tree-sitter>=0.20",
    "tiktoken>=0.5",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-java",
    "tree-sitter-c-sharp",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-php",
    "tree-sitter-go",
    "tree-sitter-rust",
    "networkx>=3.0",
]

[project.scripts]
repodoc = "repodoc.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repodoc"]
